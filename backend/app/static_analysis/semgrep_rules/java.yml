rules:
  - id: xai-java-sql-concat
    languages: [java]
    severity: ERROR
    message: SQL query built by string concatenation and run with Statement; user input can change the query (SQL injection).
    metadata: {cwe: "CWE-89", owasp: "A03:2021 - Injection", category: security}
    pattern-either:
      - pattern: $STMT.executeQuery(<... "..." + $X ...>)
      - pattern: $STMT.executeUpdate(<... "..." + $X ...>)
      - pattern: $STMT.execute(<... "..." + $X ...>)
      - patterns:
          - pattern-either:
              - pattern: $STMT.executeQuery($Q)
              - pattern: $STMT.executeUpdate($Q)
              - pattern: $STMT.execute($Q)
          - pattern-either:
              - pattern-inside: |
                  String $Q = <... "..." + $X ...>;
                  ...
              - pattern-inside: |
                  $Q = <... "..." + $X ...>;
                  ...

  - id: xai-java-runtime-exec
    languages: [java]
    severity: ERROR
    message: Operating-system command built from variable input; an attacker could inject extra commands.
    metadata: {cwe: "CWE-78", owasp: "A03:2021 - Injection", category: security}
    pattern-either:
      - patterns:
          - pattern: Runtime.getRuntime().exec($X, ...)
          - pattern-not: Runtime.getRuntime().exec("...", ...)
      - pattern: new ProcessBuilder(..., "..." + $X, ...)
      - pattern: new ProcessBuilder(..., $X + "...", ...)

  - id: xai-java-hardcoded-password
    languages: [java]
    severity: ERROR
    message: A password or secret is hard-coded in the source code.
    metadata: {cwe: "CWE-798", owasp: "A07:2021 - Identification and Authentication Failures", category: security}
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: String $PASS = "...";
              - pattern: private static final String $PASS = "...";
              - pattern: static final String $PASS = "...";
              - pattern: private String $PASS = "...";
              - pattern: final String $PASS = "...";
          - metavariable-regex:
              metavariable: $PASS
              regex: (?i).*(password|passwd|pwd|secret).*
          - pattern-not: String $PASS = "";
      - pattern: DriverManager.getConnection($U, $USER, "...")

  - id: xai-java-object-input-stream
    languages: [java]
    severity: ERROR
    message: Java deserialisation of untrusted data with ObjectInputStream can run attacker-controlled code.
    metadata: {cwe: "CWE-502", owasp: "A08:2021 - Software and Data Integrity Failures", category: security}
    pattern-either:
      - pattern: new ObjectInputStream(...).readObject()
      - patterns:
          - pattern: $OIS.readObject()
          - pattern-either:
              - pattern-inside: |
                  ObjectInputStream $OIS = ...;
                  ...
              - pattern-inside: |
                  try (ObjectInputStream $OIS = ...) { ... }

  - id: xai-java-path-traversal
    languages: [java]
    severity: WARNING
    message: A file path is built from input without checking it stays inside the intended folder (path traversal).
    metadata: {cwe: "CWE-22", owasp: "A01:2021 - Broken Access Control", category: security}
    patterns:
      - pattern-either:
          - pattern: new File($BASE + $NAME)
          - pattern: new File($DIR, $NAME)
          - pattern: Paths.get($BASE, $NAME)
          - pattern: Path.of($BASE, $NAME)
      - pattern-not: new File($BASE + "...")
      - pattern-not: new File($DIR, "...")
      - pattern-not: Paths.get($BASE, "...")
      - pattern-not: Path.of($BASE, "...")
      - pattern-not: new File("..." + "...")

  - id: xai-java-weak-crypto
    languages: [java]
    severity: WARNING
    message: Weak or broken cryptographic algorithm (MD5, SHA-1, DES or ECB mode).
    metadata: {cwe: "CWE-327", owasp: "A02:2021 - Cryptographic Failures", category: security}
    pattern-either:
      - patterns:
          - pattern: MessageDigest.getInstance("$ALG", ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i)^(MD2|MD4|MD5|SHA-?1|SHA)$
      - patterns:
          - pattern: Cipher.getInstance("$ALG", ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i)^(DES|DESede|RC2|RC4|Blowfish|AES$|AES/ECB).*

  - id: xai-java-xxe
    languages: [java]
    severity: ERROR
    message: XML parser created without disabling external entities (XXE); a crafted XML file can read local files.
    metadata: {cwe: "CWE-611", owasp: "A05:2021 - Security Misconfiguration", category: security}
    patterns:
      - pattern: DocumentBuilderFactory.newInstance()
      - pattern-not-inside: |
          $T $F = DocumentBuilderFactory.newInstance();
          ...
          $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
      - pattern-not-inside: |
          $F = DocumentBuilderFactory.newInstance();
          ...
          $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);

  - id: xai-java-empty-catch
    languages: [java]
    severity: WARNING
    message: Empty catch block silently ignores the error.
    metadata: {cwe: "CWE-390", category: reliability}
    pattern: |
      try { ... } catch ($T $E) { }
