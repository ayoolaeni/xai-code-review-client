[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-code-review"
version = "1.0.0"
description = "Explainable AI Code Review Assistant (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "slowapi>=0.1.9",
    "apscheduler>=3.10,<4",
    "google-genai>=1.0",
    "jinja2>=3.1",
    "weasyprint>=62",
    "bandit>=1.7.9",
    "javalang>=0.13",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Semgrep is a separate extra because it has no stable native Windows build;
# the Docker image always installs it.
tools = ["semgrep>=1.80"]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "black>=24",
    "pandas>=2.2",
    "scipy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "llm/prompts/v1/*.txt",
    "templates/*.html",
    "static_analysis/semgrep_rules/*.yml",
    "static_analysis/eslint/*.json",
    "static_analysis/eslint/*.mjs",
    "static_analysis/pmd/*.xml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "tools: runs real static-analysis tools (skipped when not installed)",
    "perf: performance test against a real LLM (run manually)",
    "live_gemini: calls the real Gemini API (needs GEMINI_API_KEY and RUN_LIVE_TESTS=1)",
]
addopts = "-q -m 'not perf and not live_gemini'"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with:Warning"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "B904"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests", "common", "export_for_labelling"]

[tool.black]
line-length = 110
target-version = ["py312"]
extend-exclude = "tests/fixtures"
